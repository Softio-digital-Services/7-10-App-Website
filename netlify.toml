# The Next.js app lives in /web. Keep this file at the repo root and leave "Base directory" empty in the
# Netlify UI: this file sets it. (If the UI sets a base directory, Netlify ignores this file.)
[build]
  base = "web"
  # `npm run build` already runs `prisma generate`.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
